name: Frete ranking safety

on:
  pull_request:
    paths:
      - '.github/workflows/frete-ranking-safety.yml'
      - 'scripts/tests/fretes-ranking.test.mjs'
      - 'src/lib/fretes/domain.js'
      - 'src/lib/telefone.js'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/frete-ranking-safety.yml'
      - 'scripts/tests/fretes-ranking.test.mjs'
      - 'src/lib/fretes/domain.js'
      - 'src/lib/telefone.js'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: frete-ranking-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frete-ranking-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # Pure domain calculation: no dependencies, secrets, database or application boot.
      - name: Ranking regression tests
        run: node --test scripts/tests/fretes-ranking.test.mjs
